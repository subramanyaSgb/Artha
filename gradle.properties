# Gradle JVM options. -Xmx2g is comfortable for a single-module Android app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache off for now; some Android/KSP plugins still have rough edges with it.
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false

# Kotlin
kotlin.code.style=official
# Incremental KSP — speeds up Session 2 onward.
ksp.incremental=true
