<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Artha — Visual Revamp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500;600&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="components/tokens.css"/>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    html, body {
      width: 100%; min-height: 100vh; margin: 0;
      background:
        radial-gradient(1200px 800px at 80% 10%, rgba(15,118,110,0.10) 0%, transparent 60%),
        radial-gradient(900px 600px at 10% 90%, rgba(194,132,28,0.08) 0%, transparent 60%),
        #050807;
    }
    #stage {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
      gap: 32px;
    }
    .meta-side {
      max-width: 360px;
      color: var(--text-2);
      font-family: var(--font-ui);
      font-size: 13px;
      line-height: 1.6;
    }
    .meta-side h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: 44px;
      line-height: 1;
      margin: 0 0 12px;
      color: var(--text-1);
      letter-spacing: -0.02em;
    }
    .meta-side h1 .deva-mark {
      font-family: var(--font-deva);
      color: var(--teal-300);
      font-size: 40px;
    }
    .meta-side p { margin: 8px 0; }
    .meta-side .note { color: var(--text-3); font-size: 12px; margin-top: 16px; }
    .stack-buttons { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .stack-buttons button {
      background: var(--surface-2); border: 1px solid var(--line-2); color: var(--text-1);
      border-radius: 12px; padding: 10px 14px; font-family: var(--font-ui); font-size: 13px;
      text-align: left; cursor: pointer; transition: background .15s;
    }
    .stack-buttons button:hover { background: var(--surface-3); }
    .stack-buttons .group { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-3); margin: 10px 0 4px; font-weight: 600; }

    @media (max-width: 980px) {
      .meta-side { display: none; }
    }
  </style>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="80" height="80" fill="#0F766E"/>
      <text x="40" y="55" text-anchor="middle" fill="#fff" font-size="50" font-family="serif">अ</text>
    </svg>
  </template>
</head>
<body>
  <div id="root"></div>

  <!-- App scripts (load order matters — shared components first) -->
  <script type="text/babel" src="components/patterns.jsx"></script>
  <script type="text/babel" src="components/chrome.jsx"></script>
  <script type="text/babel" src="components/screen-dashboard.jsx"></script>
  <script type="text/babel" src="components/screen-transactions.jsx"></script>
  <script type="text/babel" src="components/screen-accounts.jsx"></script>
  <script type="text/babel" src="components/screens-more-1.jsx"></script>
  <script type="text/babel" src="components/screens-more-2.jsx"></script>
  <script type="text/babel" src="components/sheets.jsx"></script>
  <script type="text/babel" src="components/sheets-extra.jsx"></script>
  <script type="text/babel" src="components/tweaks-panel.jsx"></script>
  <script type="text/babel" src="components/app.jsx"></script>
</body>
</html>
